<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your TWC 2026 Summit Pass — QOHEL Africa Group</title>
  <meta name="description" content="Your generated Wealth Convergence 2026 credential with a unique transaction ID and scannable QR verification code.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/assets/js/tickets.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --background: oklch(0.16 0.028 265);
      --foreground: oklch(0.97 0.005 260);
      --card: oklch(0.2 0.03 265);
      --muted-foreground: oklch(0.72 0.02 260);
      --gold: oklch(0.83 0.13 89);
      --border: oklch(0.34 0.03 265);
    }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background-color: oklch(0.16 0.028 265);
      color: oklch(0.97 0.005 260);
      min-height: 100vh;
    }
    main { min-height: 100vh; padding: 32px 16px 48px; }
    .container { max-width: 1024px; margin: 0 auto; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .check-icon { color: #d4af37; width: 24px; height: 24px; flex-shrink: 0; }
    .title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(22px, 3.5vw, 32px); color: oklch(0.97 0.005 260); }
    .subtitle { font-size: 11px; letter-spacing: 0.18em; color: oklch(0.72 0.02 260); text-transform: uppercase; margin-top: 4px; }
    .subtitle span { color: #d4af37; }
    #ticket-print { margin-top: 0; }
    .actions { margin-top: 24px; display: grid; gap: 12px; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .actions { grid-template-columns: repeat(3, 1fr); } }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 6px; padding: 12px 16px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
      text-decoration: none; font-family: 'Montserrat', system-ui, sans-serif;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-gold { background: linear-gradient(135deg, #9a7a1a, #f5e8a0 45%, #d4af37); color: #111; border: none; }
    .btn-outline { background: transparent; color: oklch(0.97 0.005 260); border: 1px solid oklch(0.34 0.03 265); }
    .btn-outline:hover { border-color: rgba(212,175,55,0.6); }
    .note { margin-top: 24px; font-size: 12px; color: oklch(0.72 0.02 260); line-height: 1.7; }
    .not-found { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .not-found h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(22px, 3.5vw, 32px); color: oklch(0.97 0.005 260); }
    .not-found p { margin-top: 12px; font-size: 14px; color: oklch(0.72 0.02 260); }
    .not-found a { display: inline-block; margin-top: 24px; color: #d4af37; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; }
    @media print {
      body { background: white; }
      .actions, .note { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="container" id="app">
      <!-- Loaded by JS -->
    </div>
  </main>

  <script>
    (async function () {
      const app = document.getElementById('app');
      const pathParts = window.location.pathname.split('/');
      const id = decodeURIComponent(pathParts[pathParts.length - 1] || '');

      if (!id || id === 'ticket') {
        app.innerHTML = `<div class="not-found">
          <div>
            <h1>No pass ID specified</h1>
            <p>Please open your pass from the checkout success screen.</p>
            <a href="/">Back to pass tiers</a>
          </div>
        </div>`;
        return;
      }

      const ticket = window.QAG_TICKETS.findTicket(id);

      if (!ticket) {
        // Try fetching from server registry
        try {
          const res = await fetch('/api/tickets/' + encodeURIComponent(id));
          const data = await res.json();
          if (data.ticket) {
            window.QAG_TICKETS.saveTicket(data.ticket);
            return location.reload();
          }
        } catch(_) {}

        app.innerHTML = `<div class="not-found">
          <div>
            <h1>Pass not found on this device</h1>
            <p>Credential #${id} isn't stored in this browser. Open it on the device used at checkout.</p>
            <a href="/">Back to pass tiers</a>
          </div>
        </div>`;
        return;
      }

      const verifyUrl = window.location.origin + '/verify/' + encodeURIComponent(ticket.id);
      const tier = window.QAG_TICKETS.getTier(ticket.tier);
      const fmt  = window.QAG_TICKETS.formatKsh;

      const cardHtml = await window.QAG_TICKETS.renderTicketCardHTML(ticket, verifyUrl);

      app.innerHTML = `
        <div class="header">
          <svg class="check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <div>
            <h1 class="title">Payment confirmed</h1>
            <p class="subtitle">M-PESA ref <span>${ticket.transactionId}</span> &middot; <span>${fmt(ticket.amount)}</span></p>
          </div>
        </div>

        <div id="ticket-print">${cardHtml}</div>

        <div class="actions">
          <button onclick="window.print()" class="btn btn-gold">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
            Print / Save PDF
          </button>
          <a href="/verify/${encodeURIComponent(ticket.id)}" class="btn btn-outline">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Test QR verification
          </a>
          <a href="/" class="btn btn-outline">Buy another pass</a>
        </div>

        <p class="note">
          Scanning the QR opens the verification endpoint. This credential admits
          ${ticket.seats === 1 ? 'one delegate once' : 'up to ' + ticket.seats + ' scans'} —
          scan attempts beyond that are rejected.
        </p>`;

      // Render QR codes after HTML is in the DOM
      window.QAG_TICKETS.renderQRsInContainer(app, verifyUrl);

    })();
  </script>
</body>
</html>
