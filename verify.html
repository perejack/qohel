<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pass Verification — TWC 2026 Gate Control</title>
  <meta name="description" content="Live verification result for a Wealth Convergence 2026 credential, including remaining admission scans.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/assets/js/tickets.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background-color: oklch(0.16 0.028 265);
      color: oklch(0.97 0.005 260);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 440px;
      background: oklch(0.2 0.03 265);
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      border: 1px solid oklch(0.34 0.03 265);
    }
    .card.valid   { border-color: rgba(212,175,55,0.5); color: #d4af37; }
    .card.exhausted { border-color: rgba(239,68,68,0.5); color: #f87171; }
    .card.unknown  { border-color: rgba(239,68,68,0.5); color: #f87171; }
    .icon { width: 48px; height: 48px; margin: 0 auto 16px; }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(22px, 4vw, 30px);
      color: oklch(0.97 0.005 260);
      margin-bottom: 6px;
    }
    .pass-id { font-size: 11px; letter-spacing: 0.2em; color: oklch(0.72 0.02 260); text-transform: uppercase; }
    dl { margin-top: 24px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
    .row {
      display: flex; justify-content: space-between; gap: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px; font-size: 14px;
    }
    dt { color: oklch(0.72 0.02 260); }
    dd { font-weight: 600; color: oklch(0.97 0.005 260); text-align: right; }
    .msg { margin-top: 24px; font-size: 14px; color: oklch(0.72 0.02 260); line-height: 1.6; }
    .scan-another { display: inline-block; margin-top: 32px; color: #d4af37; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; }
    .scan-another:hover { opacity: 0.75; }

    /* Gate scanner input page */
    .scanner-page { width: 100%; max-width: 480px; text-align: center; }
    .scanner-page h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 28px; color: oklch(0.97 0.005 260); margin-bottom: 8px; }
    .scanner-page p  { color: oklch(0.72 0.02 260); font-size: 13px; margin-bottom: 24px; }
    .scanner-form    { display: flex; flex-direction: column; gap: 12px; }
    .scanner-form input {
      background: oklch(0.2 0.03 265); border: 1px solid oklch(0.34 0.03 265);
      color: oklch(0.97 0.005 260); border-radius: 6px; padding: 12px 14px;
      font-size: 13px; font-family: 'Montserrat', system-ui, sans-serif;
      outline: none; transition: border-color 0.2s;
    }
    .scanner-form input:focus { border-color: rgba(212,175,55,0.6); }
    .scanner-form button {
      background: linear-gradient(135deg, #9a7a1a, #f5e8a0 45%, #d4af37);
      color: #111; border: none; border-radius: 6px; padding: 12px 20px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      cursor: pointer; font-family: 'Montserrat', system-ui, sans-serif;
      transition: opacity 0.2s;
    }
    .scanner-form button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    (function () {
      const app = document.getElementById('app');
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      // /verify/:id  → pathParts = ['verify','TWC-...']
      const id = pathParts.length >= 2 ? decodeURIComponent(pathParts[pathParts.length - 1]) : null;

      if (!id || pathParts[pathParts.length - 1] === 'verify') {
        // Show manual gate-scan input
        renderScanner();
        return;
      }

      // Register scan
      const result = window.QAG_TICKETS.registerScan(id);
      renderResult(result, id);

      function renderScanner() {
        app.innerHTML = `
          <div class="scanner-page">
            <h1>Gate Control Scanner</h1>
            <p>Enter a credential ID manually to verify admission.</p>
            <div class="scanner-form">
              <input type="text" id="scan-input" placeholder="e.g. TWC-VIP-A1B2C3" autocomplete="off" spellcheck="false">
              <button onclick="handleScan()">Verify Pass</button>
            </div>
          </div>`;
      }

      function handleScan() {
        const val = document.getElementById('scan-input').value.trim();
        if (!val) return;
        window.location.href = '/verify/' + encodeURIComponent(val);
      }
      window.handleScan = handleScan;

      function renderResult(result, id) {
        const { status, ticket } = result;
        const tier = ticket ? window.QAG_TICKETS.getTier(ticket.tier) : null;
        const used = ticket ? ticket.scans.length : 0;

        let iconSvg, label, cardCls;
        if (status === 'valid') {
          cardCls = 'valid';
          label   = 'Admission granted';
          iconSvg = `<svg class="icon" fill="none" stroke="#d4af37" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
        } else if (status === 'exhausted') {
          cardCls = 'exhausted';
          label   = 'Scan limit reached';
          iconSvg = `<svg class="icon" fill="none" stroke="#f87171" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>`;
        } else {
          cardCls = 'unknown';
          label   = 'Credential not recognised';
          iconSvg = `<svg class="icon" fill="none" stroke="#f87171" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
        }

        let detailsHtml = '';
        if (ticket && tier) {
          detailsHtml = `<dl>
            <div class="row"><dt>Delegate</dt><dd>${ticket.name}</dd></div>
            <div class="row"><dt>Organization</dt><dd>${ticket.organization}</dd></div>
            <div class="row"><dt>Class</dt><dd>${tier.classLabel}</dd></div>
            <div class="row"><dt>Scans used</dt><dd>${used} of ${ticket.seats}</dd></div>
            <div class="row"><dt>Transaction</dt><dd>${ticket.transactionId}</dd></div>
          </dl>`;
        }

        let msgHtml = '';
        if (status === 'exhausted') {
          msgHtml = `<p class="msg">All ${ticket ? ticket.seats : ''} permitted entries for this credential have already been scanned.</p>`;
        } else if (status === 'unknown') {
          msgHtml = `<p class="msg">No credential with this ID was issued on this device.</p>`;
        }

        app.innerHTML = `
          <div class="card ${cardCls}">
            ${iconSvg}
            <h1>${label}</h1>
            <p class="pass-id">#${id}</p>
            ${detailsHtml}
            ${msgHtml}
            <a href="/verify" class="scan-another">Scan another pass</a>
          </div>`;
      }
    })();
  </script>
</body>
</html>
